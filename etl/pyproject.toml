[project]
name = "namdonggu-carbon-map-etl"
version = "0.1.0"
description = "ETL + AI for 남동구 탄소지도"
requires-python = ">=3.11"
dependencies = [
  "geopandas>=1.0",
  "shapely>=2.0",
  "pandas>=2.2",
  "pyproj>=3.6",
  "psycopg[binary]>=3.2",
  "requests>=2.32",
  "tenacity>=9.0",
  "pyarrow>=17.0",
  "python-dotenv>=1.0",
  "tqdm>=4.66",
  "chardet>=5.2",
  # AI
  "xgboost>=2.1",
  "scikit-learn>=1.5",
  "numpy>=1.26",
  "onnx>=1.16",
  "onnxmltools>=1.12",
  "skl2onnx>=1.17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "mypy>=1.11",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
python_version = "3.11"
