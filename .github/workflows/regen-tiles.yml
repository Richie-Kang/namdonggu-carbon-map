name: regen-tiles

on:
  workflow_dispatch:

jobs:
  tiles:
    name: PMTiles 재생성
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Install tippecanoe
        run: |
          sudo apt-get update -q
          sudo apt-get install -y tippecanoe

      - name: Install ETL dependencies
        run: pip install -e etl/

      - name: Export PMTiles
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python etl/07_export_pmtiles.py

      - name: Commit updated tiles
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/tiles/
          git diff --cached --quiet || git commit -m "chore(tiles): PMTiles 재생성 (population_pred 포함)"
          git pull --rebase
          git push
