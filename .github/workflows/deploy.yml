name: deploy

on:
  push:
    branches: [main]

jobs:
  vercel:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: pull Vercel env
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: |
          npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }} ./web
      - name: build
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }} ./web
      - name: deploy
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} ./web
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
